components:
  schemas:
    ErrorModel:
      type: object
      required:
        - message
      properties:
        message:
          type: string
  responses:
    InternalServerError:
      description: Internal server error (500)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    BadRequestError:
      description: Bad request error (400)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    NotFoundError:
      description: Not found error (404)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    UnprocessableEntityError:
      description: Unprocessable entity error (422)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
