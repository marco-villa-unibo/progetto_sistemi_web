components:
  schemas:
    Product:
      description: Product Model
      type: object
      required:
        - title
        - pDescription
        - category
        - price
        - quantity
        - imageUrl
      properties:
        id:
          type: integer
          format: int64
          example: 0
        title:
          type: string
          example: Penna
        pDescription:
          type: string
          example: Penna multicolore BIC
        category:
          $ref: '#/components/schemas/Category'
        price:
          type: number
          format: double
          example: 9.99
        quantity:
          type: integer
          format: int64
          example: 10
        imageUrl:
          type: string
          example: https://localohost:8080/img/img1.jpg
