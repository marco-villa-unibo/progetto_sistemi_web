components:
  schemas:
    User:
      description: User Model
      type: object
      required:
        - username
        - firstName
        - lastName
        - email
        - password
        - address
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: theUser
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: James
        email:
          type: string
          example: john@email.com
        password:
          type: string
          example: 'Password1!'
        phone:
          type: string
          example: '12345'
        address:
          type: string
          example: via Roma, 1 - Roma
        userRole:
          $ref: '#/components/schemas/UserRole'
