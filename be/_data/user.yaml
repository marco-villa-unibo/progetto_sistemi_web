components:
  schemas:
    User:
      description: User Model
      type: object
      required:
        - username
        - firstName
        - lastName
        - email
        - address
      properties:
        username:
          type: string
          example: theUser
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: James
        email:
          type: string
          example: john@email.com
        phone:
          type: string
          example: '12345'
        address:
          type: string
          example: via Roma, 1 - Roma
        userRole:
          $ref: '#/components/schemas/UserRole'

    UserInput:
      description: User Model Input
      type: object
      required:
        - password
      allOf:
        - $ref: '#/components/schemas/User'
      properties:
        password:
          type: string
          example: 'Password1!'

    UserOutput:
      description: User Model Input
      type: object
      required:
        - id
      allOf:
        - $ref: '#/components/schemas/User'
      properties:
        id:
          type: integer
          format: int64
          example: 1
        token:
          type: string
          example: 'token'
    
    UserLogin:
      description: User Login Model
      type: object
      required:
        - password
      properties:
        username:
          type: string
          example: theUser
        email:
          type: string
          example: john@email.com
        password:
          type: string
          example: 'Password1!'
        
