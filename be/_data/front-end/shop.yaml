openapi: 3.0.4

info:
  title: On-Line Shop | Sistemi Web
  description: |-
    Back-End per lo store- progetto Sistemi web

    Approccio "Design first" per favorire la divisione di ruoli tra back-end e front-end

    Link utili:
    - [Repository progetto](https://github.com/marco-villa-unibo/progetto_sistemi_web)
  contact:
    email: marco.villa13@studio.unibo.it
  version: 1.0.0
  
tags:
  - name: health
    description: Health check
  - name: product
    description: gestione dei prodotti
  - name: user
    description: gestione degli user

paths:
  /health:
    get:
      description: Health check endpoint for Shop API
      operationId: healthCheck
      tags:
        - health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /product:
    get:
      tags:
        - product
      summary: Finds all products in the store.
      description: Finds all products in the store.
      operationId: findAllProducts
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '500':
          description: Unexpected server error
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - product
      summary: Update an existing product.
      description: Update an existing product by ID.
      operationId: updateProduct
      requestBody:
        description: Update an existing product in the store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid ID supplied
        '404':
          description: Product not found
        '422':
          description: Validation exception
        '500':
          description: Unexpected server error
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - product
      summary: Add a new product to the store.
      description: Add a new product to the store.
      operationId: addProduct
      requestBody:
        description: Create a new product in the store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid input
        '422':
          description: Validation exception
        '500':
          description: Unexpected server error
          $ref: '#/components/responses/InternalServerError'
  /product/{productId}:
    get:
      tags:
        - product
      summary: Finds product by ID.
      description: Returns a single product.
      operationId: findProductById
      parameters:
        - name: productId
          in: path
          description: ID of product to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid ID supplied
        '404':
          description: Product not found
        '500':
          description: Unexpected server error
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - product
      summary: Deletes a product.
      description: Delete a product (safe).
      operationId: deleteProduct
      parameters:
        - name: productId
          in: path
          description: ID of product to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Product deleted
        '400':
          description: Invalid ID supplied
        '500':
          description: Unexpected server error
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    HealthStatus:
      description: Health check status
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum:
            - OK
        timestamp:
          type: integer
          description: Number of milliseconds since Epoch time
          example: 1688612539479
    Product:
      description: Product Model
      type: object
      required:
        - title
        - price
        - quantity
      properties:
        id:
          type: integer
          format: int64
          example: 0
        title:
          type: string
          example: Penna
        pDescription:
          type: string
          example: Penna multicolore BIC
        category:
          type: string
          enum:
            - 'ORTOFRUTTA'
            - 'SURGELATI'
            - 'BANCO'
          description: Product category
          example: 'ORTOFRUTTA'
        price:
          type: number
          format: double
          example: 9.99
        quantity:
          type: integer
          format: int64
          example: 10
        imageUrl:
          type: string
          example: https://localohost:8080/img/img1.jpg
        deleted:
          type: boolean
          example: true
    User:
      description: User Model
      type: object
      required:
        - username
        - firstName
        - lastName
        - email
        - password
        - address
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: theUser
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: James
        email:
          type: string
          example: john@email.com
        password:
          type: string
          example: 'Password1!'
        phone:
          type: string
          example: '12345'
        address:
          type: string
          example: via Roma, 1 - Roma
        userRole:
          type: string
          enum:
            - 'CUSTOMER'
            - 'EMPLOYEE'
            - 'ADMIN'
          description: User role
          example: 'CUSTOMER'
        deleted:
          type: boolean
          example: true
    ErrorModel:
      type: object
      required:
        - message
      properties:
        message:
          type: string
  responses:
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    NotFoundError:
      description: Not found error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'