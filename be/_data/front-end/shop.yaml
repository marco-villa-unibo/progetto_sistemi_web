openapi: 3.0.4

info:
  title: On-Line Shop | Sistemi Web
  description: |-
    Back-End per lo store- progetto Sistemi web

    Approccio "Design first" per favorire la divisione di ruoli tra back-end e front-end

    Link utili:
    - [Repository progetto](https://github.com/marco-villa-unibo/progetto_sistemi_web)
  contact:
    email: marco.villa13@studio.unibo.it
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: health
    description: Health check
  - name: product
    description: gestione dei prodotti
  - name: user
    description: gestione degli user

paths:
  /health:
    get:
      description: Health check endpoint for Shop API
      operationId: healthCheck
      tags:
        - health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /product:
    get:
      tags:
        - product
      summary: Finds all products in the store.
      description: Finds all products in the store.
      operationId: findAllProducts
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '500':
          description: Unexpected server error
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - product
      summary: Update an existing product.
      description: Update an existing product by ID.
      operationId: updateProduct
      requestBody:
        description: Update an existing product in the store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid ID supplied
          $ref: '#/components/responses/BadRequestError'
        '404':
          description: Product not found
          $ref: '#/components/responses/NotFoundError'
        '422':
          description: Validation exception
          $ref: '#/components/responses/UnprocessableEntityError'
        '500':
          description: Unexpected server error
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - product
      summary: Add a new product to the store.
      description: Add a new product to the store.
      operationId: addProduct
      requestBody:
        description: Create a new product in the store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid input
          $ref: '#/components/responses/BadRequestError'
        '422':
          description: Validation exception
          $ref: '#/components/responses/UnprocessableEntityError'
        '500':
          description: Unexpected server error
          $ref: '#/components/responses/InternalServerError'
  /product/{productId}:
    get:
      tags:
        - product
      summary: Finds product by ID.
      description: Returns a single product.
      operationId: findProductById
      parameters:
        - name: productId
          in: path
          description: ID of product to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid ID supplied
          $ref: '#/components/responses/BadRequestError'
        '404':
          description: Product not found
          $ref: '#/components/responses/NotFoundError'
        '500':
          description: Unexpected server error
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - product
      summary: Deletes a product.
      description: Delete a product.
      operationId: deleteProduct
      parameters:
        - name: productId
          in: path
          description: ID of product to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Product deleted
        '400':
          description: Invalid ID supplied
          $ref: '#/components/responses/BadRequestError'
        '404':
          description: Product not found
          $ref: '#/components/responses/NotFoundError'
        '500':
          description: Unexpected server error
          $ref: '#/components/responses/InternalServerError'
  /user:
    get:
      tags:
        - user
      summary: Finds all users in the store.
      description: Finds all users in the store.
      operationId: findAllUsers
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '500':
          description: Unexpected server error
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - user
      summary: Update an existing user.
      description: Update an existing user by ID.
      operationId: updateUser
      requestBody:
        description: Update an existing user in the store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid ID supplied
          $ref: '#/components/responses/BadRequestError'
        '404':
          description: User not found
          $ref: '#/components/responses/NotFoundError'
        '422':
          description: Validation exception
          $ref: '#/components/responses/UnprocessableEntityError'
        '500':
          description: Unexpected server error
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - user
      summary: Add a new user.
      description: Add a new user with CUSTOMER role.
      operationId: addUser
      requestBody:
        description: Create a new user
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input
          $ref: '#/components/responses/BadRequestError'
        '422':
          description: Validation exception
          $ref: '#/components/responses/UnprocessableEntityError'
        '500':
          description: Unexpected server error
          $ref: '#/components/responses/InternalServerError'
  /user/{userId}:
    get:
      tags:
        - user
      summary: Finds user by ID.
      description: Returns a single user.
      operationId: findUserById
      parameters:
        - name: userId
          in: path
          description: ID of user to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid ID supplied
          $ref: '#/components/responses/BadRequestError'
        '404':
          description: User not found
          $ref: '#/components/responses/NotFoundError'
        '500':
          description: Unexpected server error
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - user
      summary: Deletes a user.
      description: Delete a user.
      operationId: deleteUser
      parameters:
        - name: userId
          in: path
          description: ID of user to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: User deleted
        '400':
          description: Invalid ID supplied
          $ref: '#/components/responses/BadRequestError'
        '404':
          description: User not found
          $ref: '#/components/responses/NotFoundError'
        '500':
          description: Unexpected server error
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    HealthStatus:
      description: Health check status
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum:
            - OK
        timestamp:
          type: integer
          description: Number of milliseconds since Epoch time
          example: 1688612539479
    Product:
      description: Product Model
      type: object
      required:
        - title
        - pDescription
        - category
        - price
        - quantity
      properties:
        id:
          type: integer
          format: int64
          example: 0
        title:
          type: string
          example: Penna
        pDescription:
          type: string
          example: Penna multicolore BIC
        category:
          $ref: '#/components/schemas/Category'
        price:
          type: number
          format: double
          example: 9.99
        quantity:
          type: integer
          format: int64
          example: 10
        imageUrl:
          type: string
          example: https://localohost:8080/img/img1.jpg
    User:
      description: User Model
      type: object
      required:
        - username
        - firstName
        - lastName
        - email
        - password
        - address
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: theUser
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: James
        email:
          type: string
          example: john@email.com
        password:
          type: string
          example: 'Password1!'
        phone:
          type: string
          example: '12345'
        address:
          type: string
          example: via Roma, 1 - Roma
        userRole:
          $ref: '#/components/schemas/UserRole'
    Category:
      description: Category Model
      type: string
      enum:
        - 'ORTOFRUTTA'
        - 'SURGELATI'
        - 'BANCO'
    UserRole:
      description: User Role Model
      type: string
      enum:
        - 'CUSTOMER'
        - 'EMPLOYEE'
        - 'ADMIN'
    ErrorModel:
      type: object
      required:
        - message
      properties:
        message:
          type: string
  responses:
    InternalServerError:
      description: Internal server error (500)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    BadRequestError:
      description: Bad request error (400)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    NotFoundError:
      description: Not found error (404)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    UnprocessableEntityError:
      description: Unprocessable entity error (422)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
